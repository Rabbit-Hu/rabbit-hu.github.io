{% include base_path %}
<!-- Candy, a little shimeji in the bottom-right corner: her eyes follow the pointer, her tail flicks when
     you click or tap, and she can be dragged around.
     candy.webp is the cat (2x of the display size). The sprites hold, side by side, the eye region for each
     gaze (looking at you, then n, ne, e, se, s, sw, w, nw) and the tail for each keyframe of the flick. -->
<div id="candy-shimeji" class="candy-shimeji">
  <div class="candy-shimeji__cat" aria-hidden="true">
    <img src="{{ base_path }}/images/shimeji/candy.webp" width="180" height="189" alt="" decoding="async">
    <div class="candy-shimeji__eyes"></div>
    <div class="candy-shimeji__tail"></div>
    <div class="candy-shimeji__grab"></div>
  </div>
  <button type="button" class="candy-shimeji__close" aria-label="Hide the cat" title="Hide the cat">&times;</button>
</div>
<style>
  .candy-shimeji { position: fixed; right: 8px; bottom: 0; z-index: 20; width: 180px; pointer-events: none;
    transition: opacity .3s; }
  .candy-shimeji.is-loading { opacity: 0; visibility: hidden; }
  .candy-shimeji__cat { position: relative; }
  .candy-shimeji__cat img { display: block; width: 100%; height: auto; }
  .candy-shimeji__eyes, .candy-shimeji__tail, .candy-shimeji__grab { position: absolute; }
  /* sprite boxes, as % of the image */
  .candy-shimeji__eyes { left: 65%; top: 15.3439%; width: 24.4444%; height: 10.582%;
    background: url("{{ base_path }}/images/shimeji/candy-eyes.webp") 0 0 / 900% 100% no-repeat; }
  .candy-shimeji__tail { left: 0; top: 29.6296%; width: 47.2222%; height: 38.6243%;
    background: url("{{ base_path }}/images/shimeji/candy-tail.webp") 0 0 / 600% 100% no-repeat; }
  /* only the cat itself can be grabbed; clicks anywhere else in the box reach the page below */
  .candy-shimeji__grab { left: 0; top: 0; width: 100%; height: 100%; pointer-events: auto; cursor: grab;
    touch-action: none; -webkit-clip-path: var(--candy-outline); clip-path: var(--candy-outline);
    --candy-outline: polygon(62.5% 0.5%, 61.1% 2.1%, 60.3% 6.3%, 61.1% 14.0%, 54.4% 17.2%, 49.4% 21.4%, 46.9% 25.9%, 45.3% 34.9%, 36.4% 34.9%, 30.0% 35.7%, 20.0% 38.6%, 13.6% 41.3%, 6.7% 46.3%, 3.9% 50.3%, 2.5% 53.7%, 3.1% 58.5%, 6.1% 61.6%, 8.1% 61.6%, 9.7% 60.1%, 11.1% 54.5%, 16.7% 49.5%, 24.4% 46.3%, 35.6% 44.4%, 42.2% 44.7%, 42.8% 45.2%, 42.5% 52.4%, 45.8% 59.8%, 52.5% 66.9%, 55.8% 68.8%, 58.9% 69.6%, 62.5% 72.5%, 65.0% 75.9%, 68.6% 83.3%, 69.7% 88.4%, 69.4% 94.4%, 72.2% 96.8%, 76.1% 97.9%, 79.4% 95.2%, 80.0% 91.0%, 74.7% 77.8%, 73.9% 72.0%, 74.4% 71.2%, 76.9% 70.4%, 79.2% 70.4%, 80.3% 71.2%, 82.5% 77.8%, 82.5% 82.0%, 84.7% 89.2%, 87.2% 91.8%, 88.9% 92.6%, 92.2% 92.9%, 94.4% 90.5%, 95.3% 87.6%, 90.0% 79.9%, 89.4% 75.4%, 90.6% 67.7%, 92.5% 65.9%, 92.8% 63.5%, 94.4% 61.1%, 95.8% 56.3%, 95.6% 55.3%, 98.1% 47.9%, 97.2% 35.4%, 95.6% 29.4%, 94.7% 28.6%, 93.9% 22.0%, 92.5% 17.7%, 94.7% 10.1%, 94.7% 4.2%, 93.1% 1.6%, 91.7% 1.6%, 88.6% 3.4%, 82.2% 9.5%, 72.5% 9.5%, 65.6% 1.6%, 63.9% 0.5%); }
  .candy-shimeji.is-dragging .candy-shimeji__grab { cursor: grabbing; }
  .candy-shimeji__close { position: absolute; left: 6%; top: 6%; width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(0, 0, 0, .35); color: #fff; font: 16px/22px sans-serif;
    text-align: center; cursor: pointer; opacity: .55; pointer-events: auto; transition: opacity .15s; }
  .candy-shimeji__close:hover, .candy-shimeji__close:focus-visible { opacity: 1; }
  @media (max-width: 600px) { .candy-shimeji { width: 115px; } .candy-shimeji__close { left: 0; top: 0; } }
  @media print { .candy-shimeji { display: none; } }
</style>
<script>
  /* Block comments only: the compress layout joins lines in production. */
  (function () {
    var root = document.getElementById("candy-shimeji");
    var cat = root.querySelector(".candy-shimeji__cat");
    var eyes = root.querySelector(".candy-shimeji__eyes");
    var tail = root.querySelector(".candy-shimeji__tail");
    var grab = root.querySelector(".candy-shimeji__grab");
    var closed = false;

    /* show her once the cat and both sprites have loaded, so the tail never flashes missing */
    root.classList.add("is-loading");
    var pending = 3;
    function loaded() { if (--pending <= 0) root.classList.remove("is-loading"); }
    [eyes, tail].forEach(function (el) {
      var m = /url\((['"]?)(.*?)\1\)/.exec(getComputedStyle(el).backgroundImage);
      var pic = new Image();
      pic.onload = pic.onerror = loaded;
      if (m) pic.src = m[2]; else loaded();
    });
    var img = cat.querySelector("img");
    if (img.complete) loaded(); else img.onload = img.onerror = loaded;
    setTimeout(function () { root.classList.remove("is-loading"); }, 4000);

    /* eyes: look toward the pointer, or at where the latest touch started */
    var EYES = ["c", "n", "ne", "e", "se", "s", "sw", "w", "nw"];     /* sprite order */
    var SECTORS = ["e", "se", "s", "sw", "w", "nw", "n", "ne"];       /* 45-degree sectors from atan2 */
    var ANCHOR = [0.7706, 0.2041];   /* between the eyes, as a fraction of the image */
    var DEAD_ZONE = 0.18;            /* pointer this close (x image width) means she looks at you */
    var gaze = "c", target = null, queued = false;

    function update() {
      queued = false;
      if (closed) return;
      var r = cat.getBoundingClientRect();
      var dx = target[0] - (r.left + ANCHOR[0] * r.width);
      var dy = target[1] - (r.top + ANCHOR[1] * r.height);
      var g = Math.sqrt(dx * dx + dy * dy) < DEAD_ZONE * r.width ? "c"
        : SECTORS[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
      if (g !== gaze) {
        gaze = g;
        eyes.style.backgroundPosition = EYES.indexOf(g) * 12.5 + "% 0";
      }
    }
    function lookAt(x, y) {
      target = [x, y];
      if (!queued) { queued = true; requestAnimationFrame(update); }
    }

    /* tail: a quick inward flick of the tip when something catches her attention (a click or a tap) */
    var TAIL = ["rest", "up1", "up2", "down1", "down2", "over"];   /* sprite order */
    var FLICK = [["up1", 60], ["up2", 150], ["down1", 90], ["down2", 80], ["over", 110], ["rest", 0]];  /* frame, ms */
    var REACTION_MS = 80;
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var flicking = false;
    function step(i) {
      tail.style.backgroundPosition = TAIL.indexOf(FLICK[i][0]) * 20 + "% 0";
      if (i + 1 < FLICK.length) setTimeout(function () { step(i + 1); }, FLICK[i][1]);
      else flicking = false;
    }
    function flick() {
      if (flicking || calm || closed) return;
      flicking = true;
      setTimeout(function () { step(0); }, REACTION_MS);
    }

    if (window.PointerEvent) {
      addEventListener("pointermove", function (e) { if (e.pointerType !== "touch") lookAt(e.clientX, e.clientY); }, { passive: true });
      addEventListener("pointerdown", function (e) { lookAt(e.clientX, e.clientY); flick(); }, { passive: true });
    } else {
      addEventListener("mousemove", function (e) { lookAt(e.clientX, e.clientY); }, { passive: true });
      addEventListener("mousedown", function (e) { lookAt(e.clientX, e.clientY); flick(); }, { passive: true });
      addEventListener("touchstart", function (e) { lookAt(e.touches[0].clientX, e.touches[0].clientY); flick(); }, { passive: true });
    }

    /* drag her around by the cat itself; she stays fully on screen */
    var drag = null;
    function place(x, y) {
      var r = root.getBoundingClientRect(), doc = document.documentElement;
      root.style.left = Math.max(0, Math.min(doc.clientWidth - r.width, x)) + "px";
      root.style.top = Math.max(0, Math.min(doc.clientHeight - r.height, y)) + "px";
      root.style.right = root.style.bottom = "auto";
    }
    function drop(e) {
      if (drag && e.pointerId === drag.id) { drag = null; root.classList.remove("is-dragging"); }
    }
    grab.addEventListener("pointerdown", function (e) {
      if (e.button) return;   /* primary button, a touch or a pen only */
      var r = root.getBoundingClientRect();
      drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top };
      grab.setPointerCapture(e.pointerId);
      root.classList.add("is-dragging");
      e.preventDefault();
    });
    grab.addEventListener("pointermove", function (e) {
      if (drag && e.pointerId === drag.id) place(e.clientX - drag.dx, e.clientY - drag.dy);
    });
    grab.addEventListener("pointerup", drop);
    grab.addEventListener("pointercancel", drop);

    addEventListener("resize", function () {
      if (root.style.left) { var r = root.getBoundingClientRect(); place(r.left, r.top); }
      if (target) lookAt(target[0], target[1]);
    });

    /* the close button hides her until the page is reloaded */
    root.querySelector(".candy-shimeji__close").addEventListener("click", function () {
      closed = true;
      root.parentNode.removeChild(root);
    });
  })();
</script>
